name: VibeSphere CI and Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing secret::$name is not configured in GitHub Actions secrets."
              exit 1
            fi
          done
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error title=Invalid Cloudflare account ID::CLOUDFLARE_ACCOUNT_ID must contain exactly 32 hexadecimal characters."
            exit 1
          fi
          echo "GitHub secrets are present and the account ID format is valid."

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          http="$(curl -sS -o "$response" -w '%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          success="$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(j.success===true?"true":"false")' "$response" 2>/dev/null || echo false)"
          if [[ "$success" != "true" ]]; then
            echo "::error title=Cloudflare token rejected::Cloudflare token verification failed (HTTP $http)."
            node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const e of(j.errors||[]))console.log(`::error::Cloudflare ${e.code}: ${e.message}`)}catch{}' "$response"
            echo "::error::Check that CLOUDFLARE_API_TOKEN is current and has not expired or been revoked."
            exit 1
          fi
          echo "Cloudflare token is valid."

      - name: Verify Cloudflare account access
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking token access to the configured Cloudflare account..."
          echo "Target account: ${CLOUDFLARE_ACCOUNT_ID:0:4}****${CLOUDFLARE_ACCOUNT_ID: -4}"
          response="$(mktemp)"
          http="$(curl -sS -o "$response" -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')"
          success="$(node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(j.success===true?"true":"false")' "$response" 2>/dev/null || echo false)"
          if [[ "$success" != "true" ]]; then
            echo "::error title=Cloudflare account access failed::The token is valid, but Cloudflare rejected access to the configured account (HTTP $http)."
            node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const e of(j.errors||[]))console.log(`::error::Cloudflare ${e.code}: ${e.message}`)}catch{}' "$response"
            echo "::error::Most likely causes: wrong CLOUDFLARE_ACCOUNT_ID, token not scoped to this account, or missing Workers Scripts Edit/Write permission."
            echo "::error::Open Cloudflare API Tokens, inspect Account Resources, and include the account that owns the vibesphere Worker."
            exit 1
          fi
          echo "Cloudflare account access confirmed."

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Production build verification
        run: npm run build

      - name: Cloudflare deploy
        shell: bash
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee cloudflare-deploy.log
