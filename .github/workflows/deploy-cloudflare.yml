# Fresh deployment trigger after Cloudflare credential update
name: VibeSphere CI and Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name GitHub Actions secret."
              exit 1
            fi
          done
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be exactly 32 hexadecimal characters."
            exit 1
          fi

      - name: Verify Cloudflare account access
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking Cloudflare credentials for the configured account..."
          echo "Target account: ${CLOUDFLARE_ACCOUNT_ID:0:4}****${CLOUDFLARE_ACCOUNT_ID: -4}"
          response_file="cloudflare-auth.json"
          http_code="$(curl -sS -o "$response_file" -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")" || { echo "::error::Could not reach the Cloudflare API."; exit 1; }
          success="$(node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(j.success===true?"true":"false")}catch{process.stdout.write("false")}' "$response_file")"
          if [[ "$success" != "true" ]]; then
            echo "::error::Cloudflare rejected access to the configured account (HTTP $http_code)."
            node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const e of(j.errors||[]))console.log(`::error::Cloudflare API ${e.code}: ${e.message}`)}catch{}' "$response_file"
            echo "::error::Check CLOUDFLARE_ACCOUNT_ID is the account that owns VibeSphere."
            echo "::error::Check CLOUDFLARE_API_TOKEN is a current Cloudflare API token."
            echo "::error::The token must have Workers Scripts Edit/Write permission and include this account in Account Resources."
            exit 1
          fi
          echo "Cloudflare account access confirmed."

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Production build verification
        run: npm run build

      - name: Cloudflare deploy
        shell: bash
        run: |
          set +e
          npm run deploy 2>&1 | tee cloudflare-deploy.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            echo "================ Cloudflare deployment diagnostics ================"
            if grep -q "Authentication error \[code: 10000\]" cloudflare-deploy.log; then
              echo "::error::Cloudflare API error 10000: deployment authentication/authorization was rejected."
              echo "::error::Check Workers Scripts Edit/Write permission, token account scope, and CLOUDFLARE_ACCOUNT_ID."
            elif grep -q "code: 7003" cloudflare-deploy.log; then
              echo "::error::Cloudflare API error 7003: check CLOUDFLARE_ACCOUNT_ID and Worker configuration."
            elif grep -qi "not authorized\|unauthorized\|permission" cloudflare-deploy.log; then
              echo "::error::Cloudflare rejected the deployment because of an authorization/permission problem."
            else
              echo "::error::Cloudflare deployment failed. See the original Wrangler error above."
            fi
            echo "===================================================================="
            exit "$status"
          fi
          echo "Cloudflare deployment completed successfully."
